<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Arial, sans-serif">
  <defs>
    <marker id="dep" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Diagrama de Pacotes (Visão Lógica) — Versão 1 (Modelo Inicial)</text>

  <!-- Subsistema 1: Páginas Web -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="130" height="24" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="24" width="290" height="230" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <text x="65" y="16" text-anchor="middle" font-size="11" font-weight="bold">Subsistema Web</text>
    <text x="145" y="50" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">Construção Dinâmica das Páginas Web</text>

    <rect x="35" y="75" width="220" height="55" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="145" y="100" text-anchor="middle" font-size="12" font-weight="bold">Interface do Cliente</text>
    <text x="145" y="118" text-anchor="middle" font-size="11" fill="#475569">(Cadastro e Pedidos)</text>

    <rect x="35" y="155" width="220" height="55" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="145" y="180" text-anchor="middle" font-size="12" font-weight="bold">Interface do Agente</text>
    <text x="145" y="198" text-anchor="middle" font-size="11" fill="#475569">(Avaliação e Contratos)</text>
  </g>

  <!-- Subsistema 2: Gestão de Pedidos e Contratos -->
  <g transform="translate(460, 80)">
    <rect x="0" y="0" width="150" height="24" fill="#dcfce7" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="24" width="310" height="230" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <text x="75" y="16" text-anchor="middle" font-size="11" font-weight="bold">Servidor Central</text>
    <text x="155" y="50" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">Gestão de Pedidos e Contratos</text>

    <rect x="35" y="75" width="240" height="45" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="155" y="102" text-anchor="middle" font-size="12" font-weight="bold">Módulo de Autenticação e Usuários</text>

    <rect x="35" y="135" width="240" height="45" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="155" y="162" text-anchor="middle" font-size="12" font-weight="bold">Módulo de Pedidos e Automóveis</text>

    <rect x="35" y="195" width="240" height="45" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    <text x="155" y="222" text-anchor="middle" font-size="12" font-weight="bold">Módulo de Contratos e Crédito</text>
  </g>

  <!-- Dependência entre subsistemas -->
  <line x1="340" y1="205" x2="460" y2="205" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#dep)"/>
  <text x="400" y="195" text-anchor="middle" font-size="11" fill="#334155">&lt;&lt;HTTP / Internet&gt;&gt;</text>
</svg>
