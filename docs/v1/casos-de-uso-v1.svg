<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Arial, sans-serif">
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Diagrama de Casos de Uso — Versão 1 (Modelo Inicial)</text>

  <!-- Fronteira do Sistema -->
  <rect x="230" y="45" width="430" height="410" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="445" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Sistema de Aluguel de Carros</text>

  <!-- Ator: Cliente -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="95" cy="180" r="14"/>
    <line x1="95" y1="194" x2="95" y2="235"/>
    <line x1="72" y1="208" x2="118" y2="208"/>
    <line x1="95" y1="235" x2="76" y2="265"/>
    <line x1="95" y1="235" x2="114" y2="265"/>
  </g>
  <text x="95" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Cliente</text>

  <!-- Ator: Agente -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="785" cy="180" r="14"/>
    <line x1="785" y1="194" x2="785" y2="235"/>
    <line x1="762" y1="208" x2="808" y2="208"/>
    <line x1="785" y1="235" x2="766" y2="265"/>
    <line x1="785" y1="235" x2="804" y2="265"/>
  </g>
  <text x="785" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Agente</text>
  <text x="785" y="302" text-anchor="middle" font-size="11" fill="#475569">(Empresa / Banco)</text>

  <!-- Casos de Uso -->
  <g fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5">
    <ellipse cx="445" cy="105" rx="125" ry="22"/>
    <ellipse cx="445" cy="160" rx="125" ry="22"/>
    <ellipse cx="445" cy="215" rx="125" ry="22"/>
    <ellipse cx="445" cy="270" rx="125" ry="22"/>
    <ellipse cx="445" cy="325" rx="125" ry="22"/>
    <ellipse cx="445" cy="380" rx="125" ry="22"/>
    <ellipse cx="445" cy="430" rx="125" ry="20"/>
  </g>

  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="445" y="109">UC01 - Autenticar no Sistema</text>
    <text x="445" y="164">UC02 - Introduzir Pedido de Aluguel</text>
    <text x="445" y="219">UC03 - Consultar Pedido de Aluguel</text>
    <text x="445" y="274">UC04 - Modificar Pedido de Aluguel</text>
    <text x="445" y="329">UC05 - Cancelar Pedido de Aluguel</text>
    <text x="445" y="384">UC06 - Avaliar Pedido Financeiramente</text>
    <text x="445" y="434">UC07 - Executar Contrato de Aluguel</text>
  </g>

  <!-- Associações Cliente -->
  <g stroke="#334155" stroke-width="1.4">
    <line x1="125" y1="200" x2="320" y2="105"/>
    <line x1="125" y1="205" x2="320" y2="160"/>
    <line x1="125" y1="215" x2="320" y2="215"/>
    <line x1="125" y1="225" x2="320" y2="270"/>
    <line x1="125" y1="235" x2="320" y2="325"/>
  </g>

  <!-- Associações Agente -->
  <g stroke="#334155" stroke-width="1.4">
    <line x1="755" y1="200" x2="570" y2="105"/>
    <line x1="755" y1="215" x2="570" y2="270"/>
    <line x1="755" y1="230" x2="570" y2="380"/>
    <line x1="755" y1="245" x2="570" y2="430"/>
  </g>
</svg>
