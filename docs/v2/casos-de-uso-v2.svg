<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="none" stroke="#475569" stroke-width="1.3"/>
    </marker>
    <marker id="heranca" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Diagrama de Casos de Uso — Versão 2 (Modelo Final)</text>

  <!-- Fronteira do Sistema -->
  <rect x="210" y="42" width="500" height="500" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="460" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Sistema de Aluguel de Carros (Spring Boot + React)</text>

  <!-- Ator: Cliente -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="85" cy="190" r="13"/>
    <line x1="85" y1="203" x2="85" y2="242"/>
    <line x1="64" y1="216" x2="106" y2="216"/>
    <line x1="85" y1="242" x2="67" y2="270"/>
    <line x1="85" y1="242" x2="103" y2="270"/>
  </g>
  <text x="85" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Cliente</text>

  <!-- Ator: Agente -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="835" cy="175" r="13"/>
    <line x1="835" y1="188" x2="835" y2="227"/>
    <line x1="814" y1="201" x2="856" y2="201"/>
    <line x1="835" y1="227" x2="817" y2="255"/>
    <line x1="835" y1="227" x2="853" y2="255"/>
  </g>
  <text x="835" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Agente</text>

  <!-- Ator: Banco (especialização de Agente) -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="835" cy="390" r="13"/>
    <line x1="835" y1="403" x2="835" y2="442"/>
    <line x1="814" y1="416" x2="856" y2="416"/>
    <line x1="835" y1="442" x2="817" y2="470"/>
    <line x1="835" y1="442" x2="853" y2="470"/>
  </g>
  <text x="835" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Banco Agente</text>
  <line x1="835" y1="372" x2="835" y2="285" stroke="#0f172a" stroke-width="1.5" marker-end="url(#heranca)"/>

  <!-- Casos de Uso -->
  <g fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5">
    <ellipse cx="420" cy="95" rx="130" ry="20"/>
    <ellipse cx="420" cy="145" rx="130" ry="20"/>
    <ellipse cx="420" cy="195" rx="130" ry="20"/>
    <ellipse cx="420" cy="245" rx="130" ry="20"/>
    <ellipse cx="420" cy="295" rx="130" ry="20"/>
    <ellipse cx="420" cy="345" rx="130" ry="20"/>
    <ellipse cx="420" cy="395" rx="130" ry="20"/>
    <ellipse cx="420" cy="445" rx="130" ry="20"/>
    <ellipse cx="360" cy="500" rx="125" ry="20"/>
    <ellipse cx="605" cy="500" rx="90" ry="20" fill="#fef3c7" stroke="#d97706"/>
  </g>

  <g font-size="11.5" fill="#0f172a" text-anchor="middle">
    <text x="420" y="99">UC01 - Autenticar Usuário (Login JWT)</text>
    <text x="420" y="149">UC02 - Gerenciar Cadastro de Cliente (CRUD)</text>
    <text x="420" y="199">UC03 - Consultar Frota de Automóveis</text>
    <text x="420" y="249">UC04 - Introduzir Pedido de Aluguel</text>
    <text x="420" y="299">UC05 - Consultar Status de Pedidos e Contratos</text>
    <text x="420" y="349">UC06 - Modificar Pedido Pendente</text>
    <text x="420" y="399">UC07 - Cancelar Pedido de Aluguel</text>
    <text x="420" y="449">UC08 - Gerenciar Automóveis (CRUD)</text>
    <text x="360" y="504">UC09 - Avaliar Pedido e Executar Contrato</text>
    <text x="605" y="504">UC10 - Conceder Crédito</text>
  </g>

  <!-- Extend UC10 -> UC09 -->
  <line x1="515" y1="500" x2="485" y2="500" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seta)"/>
  <text x="500" y="492" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;extend&gt;&gt;</text>

  <!-- Associações Cliente -->
  <g stroke="#334155" stroke-width="1.3">
    <line x1="115" y1="205" x2="290" y2="95"/>
    <line x1="115" y1="210" x2="290" y2="145"/>
    <line x1="115" y1="215" x2="290" y2="195"/>
    <line x1="115" y1="220" x2="290" y2="245"/>
    <line x1="115" y1="225" x2="290" y2="295"/>
    <line x1="115" y1="230" x2="290" y2="345"/>
    <line x1="115" y1="235" x2="290" y2="395"/>
  </g>

  <!-- Associações Agente -->
  <g stroke="#334155" stroke-width="1.3">
    <line x1="805" y1="195" x2="550" y2="95"/>
    <line x1="805" y1="200" x2="550" y2="145"/>
    <line x1="805" y1="205" x2="550" y2="195"/>
    <line x1="805" y1="215" x2="550" y2="295"/>
    <line x1="805" y1="220" x2="550" y2="345"/>
    <line x1="805" y1="230" x2="550" y2="445"/>
    <line x1="805" y1="240" x2="485" y2="500"/>
    <line x1="805" y1="425" x2="695" y2="500"/>
  </g>
</svg>
